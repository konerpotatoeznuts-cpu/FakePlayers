# FakePlayers config. Messages use MiniMessage (https://docs.advntr.dev/minimessage/format.html)

defaults:
  # blocks per tick for queue walking and following (PvP speed is in the pvp options)
  speed: 0.2
  chat-interval-seconds: 60
  # preset a new bot starts with (see pvp.presets below)
  preset: sword

platform:
  # Name prefix shown on Bedrock bots (Floodgate's default prefix is a dot). Use "" for none.
  bedrock-prefix: "."

follow:
  # bots stop this many blocks away from who they follow
  distance: 3.0

build:
  enabled: true
  # if true, /bot place removes one block from the bot's held stack
  consume-items: false
  # bots will never break or place these
  blocked-materials:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - JIGSAW

death:
  # ticks until a killed bot respawns at its home. -1 = bot is removed instead.
  respawn-delay-ticks: 100
  # true = the bot's inventory drops on death (and is emptied). false = it keeps its inventory.
  drop-items: false

chat:
  # MiniMessage with <bot> and <message>
  format: '<white>\<<bot>> <message></white>'

# ---------------------------------------------------------------------------
# PvP
# pvp.defaults is filled in automatically with every option (see /bot pvp <bot> list).
# A bot's value comes from: its own custom value (GUI / /bot pvp set) -> its preset -> pvp.defaults.
# Presets only need the options they change.
# ---------------------------------------------------------------------------
pvp:
  presets:
    sword:
      shield.enabled: true
      heal.enabled: true
      weapon.prefer: "SWORD,AXE"
      move.strafe: circle
    axe:
      weapon.prefer: "AXE,SWORD"
      shield.enabled: false
      weapon.shield-break: true
      move.jump-crit: true
      move.jump-chance: 0.6
    mace:
      mace.enabled: true
      mace.wind-charge: true
      weapon.prefer: "MACE,SWORD"
      shield.enabled: false
      move.min-distance: 3.0
      move.max-distance: 4.0
    crystal:
      crystal.enabled: true
      crystal.place-obsidian: true
      totem.refill: true
      shield.enabled: false
      weapon.prefer: "SWORD,AXE"
      move.strafe: random
      move.min-distance: 3.0
      move.max-distance: 4.5
    anchor:
      anchor.enabled: true
      totem.refill: true
      shield.enabled: false
      weapon.prefer: "SWORD,AXE"
      move.strafe: random
      move.min-distance: 3.0
      move.max-distance: 4.5
    trap:
      web.enabled: true
      lava.enabled: true
      drain.enabled: true
      drain.reweb: true
      lava.require-web: true
      weapon.prefer: "SWORD,AXE"
    ranged:
      ranged.enabled: true
      move.min-distance: 10.0
      move.max-distance: 20.0
      weapon.prefer: "SWORD"
      shield.enabled: false
    pot:
      heal.splash: true
      heal.potion-health: 14.0
      heal.gap-health: 6.0
      buff.enabled: true
      weapon.prefer: "SWORD,AXE"
      shield.enabled: false
    hybrid:
      crystal.enabled: true
      anchor.enabled: true
      web.enabled: true
      lava.enabled: true
      drain.enabled: true
      mace.enabled: true
      pearl.enabled: true
      weapon.prefer: "MACE,AXE,SWORD"
      shield.enabled: false
    bedrock-spam:
      hit.cps: 14.0
      hit.miss-chance: 0.12
      aim.speed: 45.0
      move.strafe: random

  # Loadouts: /bot kit <bot> [name] or the kit button. Format: MATERIAL [amount] [enchantment=level] [potion=type]
