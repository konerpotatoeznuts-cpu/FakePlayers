# Console commands run for integration with your other plugins.
# Placeholders: %bot% %victim% %player% %item% %platform% %x% %y% %z%
# Leave a list empty ([]) to disable it.
integration:
  # A bot kills a player (victim = player name). Point this at your kill progression plugin.
  bot-kills-player: []
  # A player kills a bot (player = killer).
  player-kills-bot: []
  # Every time a bot lands a melee hit (victim = entity type or player name, item = the held item type).
  # Use this to trigger custom weapon abilities.
  on-bot-hit: []
  # Run by "/bot use <bot>".
  on-use: []

messages:
  prefix: "<gray>[<aqua>Bots</aqua>]</gray> "
  no-bot: "<red>No bot named <white>%name%</white>.</red>"
  exists: "<red>A bot named <white>%name%</white> already exists.</red>"
  spawned: "<green>Spawned bot <white>%name%</white>.</green>"
  removed: "<yellow>Removed bot <white>%name%</white>.</yellow>"
  done: "<green>Done.</green>"
  players-only: "<red>Only players can use this.</red>"
  bad-args: "<red>Usage: %usage%</red>"
  unknown-sub: "<red>Unknown subcommand. Try <white>/bot help</white>.</red>"
  reloaded: "<green>Config reloaded.</green>"
  not-loaded: "<red>Bot <white>%name%</white> isn't loaded (its chunk may be unloaded). Try <white>/bot respawn %name%</white>.</red>"
